apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cluster1
spec:
  kafka:
    version: 3.9.0
    replicas: 2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          brokers:
          - broker: 0
            advertisedHost: cluster1-kafka-0
            advertisedPort: 9092
          - broker: 1
            advertisedHost: cluster1-kafka-1
            advertisedPort: 9092
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 2
      min.insync.replicas: 1
      inter.broker.protocol.version: "3.9"
    storage:
      type: ephemeral
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: topic1
  labels:
    strimzi.io/cluster: cluster1
spec:
  partitions: 2
  replicas: 2
  config:
    retention.ms: 1000
    segment.bytes: 104857600
